<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1530">
<meta name="description" content="Every Ncell short code on one keypad. Tap to check balance, buy data, recharge, transfer or borrow. Unofficial helper, works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Short codes for Ncell</title>
<style>
  :root{
    --ink:#1B1530;        /* aubergine night: page */
    --plum:#2A2147;       /* raised surface */
    --plum-2:#352A5A;     /* pressed / hover surface */
    --line:#44397A;       /* borders */
    --petal:#F3EEFF;      /* primary text */
    --haze:#B4AAD4;       /* secondary text */
    --marigold:#FFB23E;   /* the one accent: anything that dials */
    --marigold-ink:#2B1B00;
    --warn:#FF8A7A;
    --r-key:22px; --r-sheet:28px; --r-ctl:14px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;
    --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);color:var(--petal);font-family:var(--font);font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:8px}
  .app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
       padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bar h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  .bar small{display:block;font-size:12.5px;font-weight:400;color:var(--haze)}
  .find{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .15s}
  .find:active{background:var(--plum-2)}
  .find svg{width:20px;height:20px;stroke:var(--petal)}

  /* the display: the code itself is the hero */
  .display{margin-top:18px;padding:20px 20px 18px;border-radius:26px;background:
      radial-gradient(120% 140% at 100% 0%,rgba(255,178,62,.16),transparent 55%),var(--plum);
    border:1px solid var(--line)}
  .display .what{font-size:14px;color:var(--haze);min-height:20px}
  .display .code{font-family:var(--round);font-weight:800;font-size:clamp(44px,15vw,68px);line-height:1.02;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 14px;word-break:break-all;min-height:1.02em}
  .display .code .caret{display:inline-block;width:.08em;height:.8em;background:var(--marigold);margin-left:.06em;vertical-align:-.04em;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .display .row{display:flex;gap:10px}
  .dial{flex:1;min-height:54px;border:0;border-radius:var(--r-ctl);background:var(--marigold);color:var(--marigold-ink);
    font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;
    transition:transform .12s,filter .15s}
  .dial:active{transform:scale(.97);filter:brightness(.92)}
  .dial svg{width:19px;height:19px;fill:var(--marigold-ink)}
  .dial[aria-disabled="true"]{opacity:.4;pointer-events:none}
  .ghost{min-width:54px;min-height:54px;border-radius:var(--r-ctl);border:1px solid var(--line);background:transparent;
    display:grid;place-items:center;transition:background .15s}
  .ghost:active{background:var(--plum-2)}
  .ghost svg{width:20px;height:20px;stroke:var(--petal);fill:none}
  .ghost.on svg{fill:var(--marigold);stroke:var(--marigold)}

  /* keypad: each key is a family of services */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .key{aspect-ratio:1/0.86;border-radius:var(--r-key);border:1px solid var(--line);background:var(--plum);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;
    transition:transform .12s,background .15s,border-color .15s}
  .key:active{transform:scale(.94);background:var(--plum-2);border-color:var(--marigold)}
  .key b{font-family:var(--round);font-size:30px;font-weight:700;line-height:1}
  .key span{font-size:13px;color:var(--haze);font-weight:500}
  .key.all b{color:var(--marigold)}

  /* shortcuts under the pad */
  .strip{margin-top:18px}
  .strip h2{font-size:14px;font-weight:600;color:var(--haze);margin:0 0 8px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;min-height:44px;
    display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;transition:background .15s}
  .chip:active{background:var(--plum-2)}
  .chip i{font-style:normal;font-family:var(--round);font-weight:700;color:var(--marigold)}
  .hint{font-size:13.5px;color:var(--haze);margin:0}

  .foot{margin-top:auto;padding-top:22px;font-size:12.5px;color:var(--haze);text-align:center}
  .foot button{background:none;border:0;color:var(--petal);text-decoration:underline;padding:8px}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(10,6,24,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:460px;margin:0 auto;max-height:88vh;
    background:var(--plum);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .sheet.open{transform:none}
  .sheet header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
  .sheet header .digit{font-family:var(--round);font-weight:800;font-size:34px;line-height:1;color:var(--marigold);min-width:26px;text-align:center}
  .sheet header h2{flex:1;margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
  .sheet header p{margin:0;font-size:13px;color:var(--haze);font-weight:400}
  .x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
  .x:active{background:var(--plum-2)}
  .body{overflow-y:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .search{width:100%;min-height:50px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--ink);padding:0 14px;margin-bottom:8px}
  .search::placeholder{color:var(--haze)}
  .grp{font-size:13px;font-weight:600;color:var(--haze);margin:16px 0 2px}

  .item{padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .top{display:flex;align-items:flex-start;gap:12px}
  .item .txt{flex:1;min-width:0}
  .item h3{margin:0;font-size:16px;font-weight:600}
  .item p{margin:2px 0 0;font-size:13.5px;color:var(--haze)}
  .item .c{font-family:var(--round);font-weight:700;font-size:17px;color:var(--petal);margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-all}
  .item .c em{font-style:normal;color:var(--haze);font-weight:500;font-size:13.5px;font-family:var(--font)}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--haze);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
  .tag.check{border-color:var(--warn);color:var(--warn)}
  .go{flex:none;min-width:84px;min-height:46px;padding:0 16px;border:0;border-radius:var(--r-ctl);background:var(--marigold);color:var(--marigold-ink);
    font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .12s,filter .15s}
  .go:active{transform:scale(.95);filter:brightness(.92)}
  .go.alt{background:transparent;border:1px solid var(--line);color:var(--petal)}
  .go[aria-disabled="true"]{opacity:.4;pointer-events:none}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:13.5px;color:var(--petal);
    display:inline-flex;align-items:center;text-decoration:none;transition:background .15s}
  .mini:active{background:var(--plum-2)}
  .mini.on{border-color:var(--marigold);color:var(--marigold)}

  .form{display:grid;gap:10px;margin-top:12px}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form label{display:block;font-size:13px;color:var(--haze);margin-bottom:4px}
  .form input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--ink);padding:0 12px;font-variant-numeric:tabular-nums}
  .form input[aria-invalid="true"]{border-color:var(--warn)}
  .form .err{font-size:12.5px;color:var(--warn);margin-top:3px}
  .form .err:empty,.form .out:empty{display:none}
  .form .out{font-family:var(--round);font-weight:700;font-size:20px;word-break:break-all}
  .note{font-size:13.5px;color:var(--haze);background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
  .note b{color:var(--petal)}
  .empty{color:var(--haze);font-size:14.5px;padding:26px 0;text-align:center}

  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--petal);color:var(--ink);
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-height:700px){ .key{aspect-ratio:1/0.72} .display .code{font-size:clamp(40px,13vw,56px)} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Short codes for Ncell<small>Unofficial helper. Not made by Ncell.</small></h1>
    <button class="find" id="findBtn" aria-label="Search all codes">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </div>

  <section class="display" aria-live="polite">
    <div class="what" id="dWhat">Main balance</div>
    <div class="code" id="dCode"></div>
    <div class="row">
      <a class="dial" id="dDial" href="tel:*901%23">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25c1.1.37 2.3.57 3.6.57a1 1 0 011 1V20a1 1 0 01-1 1C10.6 21 3 13.4 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg>
        <span id="dLabel">Dial</span>
      </a>
      <button class="ghost" id="dPin" aria-label="Pin this code" aria-pressed="false">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      </button>
      <button class="ghost" id="dCopy" aria-label="Copy this code">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 017.5 4H15"/></svg>
      </button>
    </div>
  </section>

  <nav class="pad" id="pad" aria-label="Services"></nav>

  <section class="strip">
    <h2 id="stripTitle">Pinned and recent</h2>
    <div class="chips" id="chips"></div>
    <p class="hint" id="stripHint">Codes you pin or use show up here for one-tap redial.</p>
  </section>

  <div class="foot"><a id="getApp" href="ncell-codes.apk" download style="display:none;color:var(--marigold);font-weight:600;margin-bottom:8px">Get the Android app: codes run without the dialer step</a>Codes checked November 2026 against public sources. <button id="aboutBtn">About and accuracy</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <header>
    <div class="digit" id="shDigit" aria-hidden="true"></div>
    <div style="flex:1"><h2 id="shTitle"></h2><p id="shSub"></p></div>
    <button class="x" id="shClose" aria-label="Close">✕</button>
  </header>
  <div class="body" id="shBody"></div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var IN_APP=/NepDialApp/.test(navigator.userAgent);
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
           set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tel(code){return "tel:"+code.replace(/#/g,"%23").replace(/\s+/g,"");}
function sms(to,body){return "sms:"+to+(body?"?body="+encodeURIComponent(body):"");}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}
function copy(text){
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("Copied "+text);}catch(e){toast(text);}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied "+text);},fb);}else fb();
}

/* kind: ussd (answers on screen) | menu (opens an operator menu) | call | sms | info | form
   check:true marks codes found in fewer or older sources */
var G=[
 {k:"1",name:"Balance",sub:"What you have left",items:[
   {id:"bal",n:"Main balance",d:"Balance, and any active pack, on screen.",c:"*901#",alt:"*101#",kind:"ussd"},
   {id:"valid",n:"Balance validity",d:"The date your main balance expires.",c:"*144#",kind:"ussd"},
   {id:"balsms",n:"Balance by SMS",d:"Send an empty message and the balance comes back by SMS.",kind:"sms",to:"90011",body:""},
   {id:"dataleft",n:"Data left",d:"Remaining data, validity and bonus by SMS.",kind:"sms",to:"17123",body:"S"},
   {id:"minleft",n:"Voice minutes left",d:"Remaining minutes in your voice pack by SMS.",kind:"sms",to:"17118",body:"S"}]},
 {k:"2",name:"My number",sub:"Your SIM and phone",items:[
   {id:"num",n:"My Ncell number",d:"Shows the number of the SIM you dial from.",c:"*903#",alt:"*103#",kind:"ussd"},
   {id:"imei",n:"Phone IMEI",d:"Your handset's IMEI. Works on any phone.",c:"*#06#",kind:"ussd"},
   {id:"menu",n:"Main service menu",d:"Every Ncell service in one menu.",c:"*123#",kind:"menu"}]},
 {k:"3",name:"Data",sub:"Internet packs",items:[
   {id:"data",n:"Buy a data pack",d:"Browse current packs and combos, then choose by number.",c:"*17123#",kind:"menu"},
   {id:"dataleft2",n:"Data left",d:"Remaining data, validity and bonus by SMS.",kind:"sms",to:"17123",body:"S"},
   {id:"apn",n:"Internet settings",d:"Ncell sends the APN settings to your phone.",kind:"sms",to:"9595",body:"all"},
   {id:"packsms",n:"Buy by pack code",d:"If you know a pack's code, text it to 17123 to skip the menu.",kind:"info",c:"17123"}]},
 {k:"4",name:"Voice",sub:"Minutes and My5",items:[
   {id:"voice",n:"Buy a voice pack",d:"Minute packs, chosen from a menu.",c:"*17118#",kind:"menu"},
   {id:"minleft2",n:"Voice minutes left",d:"Remaining minutes by SMS.",kind:"sms",to:"17118",body:"S"},
   {id:"my5",n:"My5 favourite numbers",d:"Cheaper calls to five numbers you choose. Press 1 to activate.",c:"*5599#",kind:"menu"}]},
 {k:"5",name:"SMS",sub:"Message packs",items:[
   {id:"smspack",n:"Buy an SMS pack",d:"Message bundles from a menu.",c:"*1119#",kind:"menu",check:true},
   {id:"dnd",n:"Stop promotional messages",d:"Text START to 1909 to block promotional SMS and calls.",kind:"sms",to:"1909",body:"START",check:true},
   {id:"smsc",n:"Message centre number",d:"Enter this in your SMS settings if messages will not send.",kind:"info",c:"+9779800009000"}]},
 {k:"6",name:"Recharge",sub:"Top up with a card",items:[
   {id:"rc",n:"Recharge this SIM",d:"Type the 16 digits under the scratch panel.",kind:"form",form:"rc"},
   {id:"rco",n:"Recharge another number",d:"Use your card on someone else's Ncell number.",kind:"form",form:"rco"},
   {id:"rcsms",n:"Recharge by SMS",d:"Text the card PIN to 90012. The message opens ready for you to type the PIN.",kind:"sms",to:"90012",body:""},
   {id:"rccall",n:"Recharge by call",d:"Call 90012 and key in the PIN when asked.",c:"90012",kind:"call"}]},
 {k:"7",name:"Transfer",sub:"Send balance",items:[
   {id:"tr",n:"Send balance",d:"Moves balance from this SIM to another Ncell number.",kind:"form",form:"tr"},
   {id:"tract",n:"Turn on balance transfer",d:"First time only: call 17122, free, to activate the service.",c:"17122",kind:"call"}]},
 {k:"8",name:"Saapati",sub:"Borrow now",items:[
   {id:"loan",n:"Borrow balance, minutes or data",d:"Repaid from your next recharge. A small service charge applies.",c:"*9988#",kind:"menu"}]},
 {k:"9",name:"Calls",sub:"Forward, wait, hide",items:[
   {id:"fwd",n:"Forward all calls",d:"Every call rings on another number.",kind:"form",form:"fwd"},
   {id:"fwdb",n:"Forward when busy",d:"Only when you are already on a call.",kind:"form",form:"fwdb"},
   {id:"fwdu",n:"Forward when unreachable",d:"Only when the phone is off or has no signal.",kind:"form",form:"fwdu"},
   {id:"fwdn",n:"Forward when no answer",d:"Only when you do not pick up.",kind:"form",form:"fwdn"},
   {id:"fwds",n:"Check forwarding",d:"Shows whether calls are being forwarded.",c:"*#21#",kind:"ussd"},
   {id:"fwdx",n:"Cancel all forwarding",d:"Removes every forward in one go.",c:"##002#",kind:"ussd"},
   {id:"cwon",n:"Call waiting on",d:"Hear a second call while on the first.",c:"*43#",kind:"ussd"},
   {id:"cwoff",n:"Call waiting off",d:"Second callers hear busy.",c:"#43#",kind:"ussd"},
   {id:"hide",n:"Hide my number for one call",d:"The person you call sees a private number.",kind:"form",form:"hide"},
   {id:"bar",n:"Cancel call barring",d:"Removes incoming and outgoing call blocks.",c:"*330*0000#",kind:"ussd",check:true}]},
 {k:"*",name:"Extras",sub:"Tune, roaming, alerts",items:[
   {id:"tune",n:"Caller tune",d:"Choose the song callers hear while your phone rings.",c:"*17117#",kind:"menu"},
   {id:"tunecall",n:"Caller tune by call",d:"Voice menu for the same service.",c:"17117",kind:"call"},
   {id:"mca",n:"Missed call alert",d:"SMS telling you who called while you were off or busy.",c:"*100#",kind:"menu",check:true},
   {id:"roam",n:"International roaming",d:"Turn roaming on before you travel.",c:"*12127#",kind:"menu"}]},
 {k:"0",name:"Support",sub:"Talk to Ncell",items:[
   {id:"care",n:"Customer care",d:"Prepaid help, complaints, lost SIM, PUK.",c:"9005",kind:"call"},
   {id:"care2",n:"Pro and Biz care",d:"For postpaid and business numbers.",c:"9007",kind:"call"},
   {id:"care3",n:"Care from another network",d:"Reach Ncell from a non-Ncell phone.",c:"9809005000",kind:"call"},
   {id:"ivr",n:"Self-service voice menu",d:"Recorded menu for balance and information.",c:"9001",kind:"call"}]}
];
var FORMS={
  rc:{f:[["pin","Card PIN","16 digits","pin"]],build:function(v){return "*102*"+v.pin+"#";},label:"Recharge"},
  rco:{f:[["pin","Card PIN","16 digits","pin"],["num","Their Ncell number","98XXXXXXXX","num"]],build:function(v){return "*102*"+v.pin+"*"+v.num+"#";},label:"Recharge"},
  tr:{f:[["num","Receiver's Ncell number","98XXXXXXXX","num"],["amt","Amount in rupees","50","amt"]],build:function(v){return "*17122*"+v.num+"*"+v.amt+"#";},label:"Send balance"},
  fwd:{f:[["num","Forward to","98XXXXXXXX","num"]],build:function(v){return "**21*"+v.num+"#";},label:"Turn on"},
  fwdb:{f:[["num","Forward to","98XXXXXXXX","num"]],build:function(v){return "**67*"+v.num+"#";},label:"Turn on"},
  fwdu:{f:[["num","Forward to","98XXXXXXXX","num"]],build:function(v){return "**62*"+v.num+"#";},label:"Turn on"},
  fwdn:{f:[["num","Forward to","98XXXXXXXX","num"]],build:function(v){return "**61*"+v.num+"#";},label:"Turn on"},
  hide:{f:[["num","Number to call","98XXXXXXXX","num"]],build:function(v){return "#31#"+v.num;},label:"Call"}
};
var RULES={
  pin:function(s){return /^\d{16}$/.test(s)?"":"The PIN has 16 digits. You have "+s.length+".";},
  num:function(s){return /^9\d{9}$/.test(s)?"":"Enter a 10-digit mobile number starting with 9.";},
  amt:function(s){return /^[1-9]\d{0,3}$/.test(s)?"":"Enter a whole amount in rupees.";}
};

var BY={}; G.forEach(function(g){g.items.forEach(function(it){it.g=g;BY[it.id]=it;});});
var pins=store.get("nc_pins",[]).filter(function(i){return BY[i];});
var recent=store.get("nc_recent",[]).filter(function(i){return BY[i];});
var current=BY.bal;

function codeText(it){ if(it.kind==="sms") return (it.body?'"'+it.body+'" ':"SMS ")+"to "+it.to; return it.c||""; }
function hrefOf(it){ if(it.kind==="sms") return sms(it.to,it.body); if(it.kind==="info"||it.kind==="form") return null; return tel(it.c); }
function verb(it){ return it.kind==="sms"?"Text":it.kind==="call"?"Call":"Dial"; }

/* ---------- display ---------- */
var typing=null;
function show(it,animate){
  current=it; $("dWhat").textContent=it.n;
  var el=$("dCode"), text=it.kind==="sms"?it.to:(it.c||"");
  clearInterval(typing);
  if(animate && window.matchMedia && !matchMedia("(prefers-reduced-motion:reduce)").matches){
    var i=0; el.innerHTML='<span class="caret"></span>';
    typing=setInterval(function(){ i++; el.innerHTML=esc(text.slice(0,i))+'<span class="caret"></span>';
      if(i>=text.length){clearInterval(typing);setTimeout(function(){el.textContent=text;},700);} },85);
  } else el.textContent=text;
  var h=hrefOf(it), d=$("dDial");
  if(h){d.setAttribute("href",h);d.setAttribute("aria-disabled","false");}else{d.removeAttribute("href");d.setAttribute("aria-disabled","true");}
  $("dLabel").textContent=verb(it)+(it.kind==="sms"&&it.body?' "'+it.body+'"':"");
  var on=pins.indexOf(it.id)>-1; $("dPin").classList.toggle("on",on); $("dPin").setAttribute("aria-pressed",on);
}
function used(it){
  recent=[it.id].concat(recent.filter(function(i){return i!==it.id;})).slice(0,6); store.set("nc_recent",recent); chips();
}
function togglePin(it){
  var i=pins.indexOf(it.id); if(i>-1){pins.splice(i,1);toast("Unpinned "+it.n);}else{pins.unshift(it.id);toast("Pinned "+it.n);}
  store.set("nc_pins",pins); chips(); if(current===it) show(it,false);
}
function chips(){
  var ids=pins.concat(recent.filter(function(i){return pins.indexOf(i)<0;})).filter(function(i){return BY[i].kind!=="form"&&BY[i].kind!=="info";}).slice(0,8);
  $("chips").innerHTML=ids.map(function(i){var it=BY[i];
    return '<a class="chip" data-use="'+i+'" href="'+hrefOf(it)+'"'+(IN_APP?'':' target="_top"')+'><i>'+esc(it.kind==="sms"?it.to:it.c)+'</i>'+esc(it.n)+'</a>';}).join("");
  $("stripHint").style.display=ids.length?"none":"block";
}

/* ---------- keypad ---------- */
$("pad").innerHTML=G.map(function(g){return '<button class="key" data-k="'+g.k+'" aria-label="'+esc(g.name+": "+g.sub)+'"><b>'+g.k+'</b><span>'+esc(g.name)+'</span></button>';}).join("")
  +'<button class="key all" data-k="#" aria-label="All codes"><b>#</b><span>All codes</span></button>';
$("pad").addEventListener("click",function(e){var b=e.target.closest(".key"); if(!b) return; var k=b.getAttribute("data-k");
  if(k==="#") openAll(); else openGroup(G.filter(function(g){return g.k===k;})[0]);});

/* ---------- sheet ---------- */
var lastFocus=null;
function itemHtml(it){
  var h=hrefOf(it), pinned=pins.indexOf(it.id)>-1, tags=(it.kind==="menu"?'<span class="tag">Opens a menu</span>':"")+(it.check?'<span class="tag check">Less common</span>':"");
  var s='<div class="item" data-id="'+it.id+'"><div class="top"><div class="txt"><h3>'+esc(it.n)+tags+'</h3><p>'+esc(it.d)+'</p>';
  if(it.kind!=="form") s+='<div class="c">'+esc(codeText(it))+(it.alt?' <em>or '+esc(it.alt)+'</em>':'')+'</div>';
  s+='</div>';
  if(h) s+='<a class="go" data-use="'+it.id+'" href="'+h+'" target="_top">'+verb(it)+'</a>';
  else if(it.kind==="info") s+='<button class="go alt" data-copy="'+esc(it.c)+'">Copy</button>';
  s+='</div>';
  if(it.kind==="form") s+=formHtml(it);
  else if(h) s+='<div class="acts"><button class="mini'+(pinned?' on':'')+'" data-pin="'+it.id+'">'+(pinned?'Pinned':'Pin')+'</button>'
    +(it.c?'<button class="mini" data-copy="'+esc(it.c)+'">Copy</button>':'')
    +(it.alt?'<a class="mini" data-use="'+it.id+'" href="'+tel(it.alt)+'" target="_top">Dial '+esc(it.alt)+'</a>':'')+'</div>';
  return s+'</div>';
}
function formHtml(it){
  var F=FORMS[it.form];
  var fields=F.f.map(function(f){return '<div><label for="'+it.id+'_'+f[0]+'">'+esc(f[1])+'</label><input id="'+it.id+'_'+f[0]+'" data-f="'+f[0]+'" data-r="'+f[3]+'" inputmode="numeric" autocomplete="off" placeholder="'+esc(f[2])+'"><div class="err"></div></div>';});
  return '<div class="form" data-form="'+it.form+'" data-id="'+it.id+'">'+(fields.length===2?'<div class="two">'+fields.join("")+'</div>':fields.join(""))
    +'<div class="out" aria-live="polite"></div><div class="top" style="gap:8px"><a class="go" style="flex:1" data-use="'+it.id+'" target="_top" aria-disabled="true">'+esc(F.label)+'</a><button class="go alt" data-fcopy style="min-width:74px">Copy</button></div></div>';
}
function wireForms(root){
  Array.prototype.forEach.call(root.querySelectorAll(".form"),function(w){
    var F=FORMS[w.getAttribute("data-form")], go=w.querySelector("a.go"), out=w.querySelector(".out");
    function upd(){
      var v={}, ok=true;
      Array.prototype.forEach.call(w.querySelectorAll("input"),function(i){
        var s=i.value.replace(/\D/g,""); if(i.value!==s) i.value=s; v[i.getAttribute("data-f")]=s;
        var msg=s?RULES[i.getAttribute("data-r")](s):""; if(!s||msg) ok=false;
        i.setAttribute("aria-invalid",msg?"true":"false"); i.parentNode.querySelector(".err").textContent=msg;
      });
      w._code=ok?F.build(v):""; out.textContent=w._code;
      if(ok){go.setAttribute("href",tel(w._code));go.setAttribute("aria-disabled","false");}else{go.removeAttribute("href");go.setAttribute("aria-disabled","true");}
    }
    w.addEventListener("input",upd);
    w.querySelector("[data-fcopy]").addEventListener("click",function(){ if(w._code) copy(w._code); else toast("Fill in the fields first"); });
  });
}
function openSheet(digit,title,sub,html){
  lastFocus=document.activeElement;
  $("shDigit").textContent=digit; $("shTitle").textContent=title; $("shSub").textContent=sub; $("shBody").innerHTML=html; $("shBody").scrollTop=0;
  wireForms($("shBody")); $("scrim").classList.add("open"); $("sheet").classList.add("open"); $("shClose").focus({preventScroll:true});
}
function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
function openGroup(g){
  var first=g.items.filter(function(i){return i.kind!=="form"&&i.kind!=="info";})[0]; if(first) show(first,true);
  var note=g.k==="7"?'<div class="note"><b>Check the number twice.</b> A transfer cannot be undone from here.</div>'
          :g.k==="6"?'<div class="note">The PIN stays on your phone. This page never sends it anywhere.</div>':"";
  openSheet(g.k,g.name,g.sub,g.items.map(itemHtml).join("")+note);
}
function allHtml(q){
  q=(q||"").trim().toLowerCase(); var html="",n=0;
  G.forEach(function(g){
    var its=g.items.filter(function(it){return !q||(it.n+" "+it.d+" "+(it.c||"")+" "+(it.alt||"")+" "+(it.to||"")+" "+g.name).toLowerCase().indexOf(q)>-1;});
    if(its.length){n+=its.length;html+='<div class="grp">'+esc(g.name)+'</div>'+its.map(itemHtml).join("");}
  });
  return n?html:'<div class="empty">Nothing matches "'+esc(q)+'". Try a word like data, recharge or forward.</div>';
}
function openAll(focusSearch){
  openSheet("#","All codes","Every Ncell code in this app",'<input class="search" id="q" type="search" placeholder="Search by name or code" aria-label="Search codes"><div id="allList">'+allHtml("")+'</div>');
  $("q").addEventListener("input",function(){ $("allList").innerHTML=allHtml(this.value); wireForms($("allList")); });
  if(focusSearch) $("q").focus();
}
function openAbout(){
  openSheet("i","About and accuracy","Read once",
   '<div class="note" style="margin-top:4px"><b>This is an independent helper.</b> It is not made, endorsed or supported by Ncell. It only fills in codes that your own phone then dials.</div>'
  +'<div class="note"><b>How dialing works.</b> '+(IN_APP?'Tap a yellow button and the code runs on your default SIM. Balance transfers ask you to confirm first.':'Tap a yellow button and your dialer opens with the code filled in. Press call to run it. The Android app runs codes without that extra step.')+'</div>'
  +'<div class="note"><b>Accuracy.</b> Codes were checked in November 2026 against Ncell\'s help pages and Nepali telecom sites. Codes tagged "Less common" appeared in fewer or older sources, so they may have changed. If a code fails, call 9005.</div>'
  +'<div class="note"><b>Cost.</b> Balance and number checks are free. Packs, loans, tunes and SMS are charged by Ncell at its own rates.</div>'
  +'<div class="note"><b>Privacy.</b> Pins and recents are saved only on this phone. Nothing is uploaded.</div>');
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target, a;
  if((a=t.closest("[data-use]"))){ var it=BY[a.getAttribute("data-use")]; if(a.getAttribute("aria-disabled")==="true"){e.preventDefault();return;}
    used(it); if(it.kind!=="form") show(it,false);
    var href=a.getAttribute("href")||"";
    if(href.indexOf("tel:")===0){ var code=decodeURIComponent(href.slice(4));
      if(IN_APP) toast("Dialing "+code); else { try{navigator.clipboard.writeText(code);}catch(x){} toast("Opening dialer with "+code); } }
    return; }
  if((a=t.closest("[data-pin]"))){ var p=BY[a.getAttribute("data-pin")]; togglePin(p); var on=pins.indexOf(p.id)>-1; a.classList.toggle("on",on); a.textContent=on?"Pinned":"Pin"; return; }
  if((a=t.closest("[data-copy]"))){ copy(a.getAttribute("data-copy")); return; }
});
$("dDial").addEventListener("click",function(){ used(current); var h=this.getAttribute("href")||""; if(h.indexOf("tel:")===0) toast((IN_APP?"Dialing ":"Opening dialer with ")+decodeURIComponent(h.slice(4))); });
if(!IN_APP) $("dDial").setAttribute("target","_top");
$("dPin").addEventListener("click",function(){togglePin(current);});
$("dCopy").addEventListener("click",function(){copy(current.kind==="sms"?current.to:current.c);});
$("findBtn").addEventListener("click",function(){openAll(true);});
$("aboutBtn").addEventListener("click",openAbout);
$("shClose").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });

if(!IN_APP && /Android/i.test(navigator.userAgent)) $("getApp").style.display="block";
chips(); show(BY[recent[0]]&&BY[recent[0]].kind!=="form"&&BY[recent[0]].kind!=="info"?BY[recent[0]]:BY.bal,true);
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
